<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Pacientes</title>
    <link rel="stylesheet" href="/src/style.css" />  
  </head>
  
  <body>
    <main class="cadastro">
      <h1 class="cadastro__titulo">Cadastro de Novo Paciente</h1>
      <form class="cadastro__formulario" action="cadastro.html" method="post">
        
        <div class="cadastro__campo">
          <label for="nome">Nome Completo:</label>
          <input type="text" id="nome" name="nome" required />
        </div>
      
        <div class="cadastro__campo">  
          <label for="data-nascimento">Data de Nascimento:</label>
          <input type="date" id="data-nascimento" name="data-nascimento" required />
        </div>

        <div class="cadastro__campo">
          <label for="cpf">CPF:</label>
          <input type="text" id="cpf" name="cpf" required />
        </div>

        <div class="cadastro__campo">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required />
        </div>

        <div class="cadastro__campo">
          <label for="telefone">Telefone:</label>
          <input type="tel" maxlength="13" id="telefone" name="telefone" required />
        </div>

        <div class="cadastro__campo">
          <label for="sexo">Sexo:</label>
          <select id="sexo" name="sexo" required>
            <option value="">Selecione</option>
            <option value="masculino">Masculino</option>
            <option value="feminino">Feminino</option>
            <option value="outro">Prefiro não informar</option>
          </select>
        </div>
        
        <div class="cadastro__campo">
          <label for="cep">CEP:</label>
          <input type="text" id="cep" name="cep" maxlength="8" required />
        </div>

        <div class="cadastro__campo">
          <label for="rua">Rua:</label>
          <input type="text" id="rua" name="rua" required />
        </div>

        <div class="cadastro__campo">
          <label for="bairro">Bairro:</label>
          <input type="text" id="bairro" name="bairro" required />
        </div>

        <div class="cadastro__campo">
          <label for="cidade">Cidade:</label>
          <input type="text" id="cidade" name="cidade" required />
        </div>

        <div class="cadastro__campo">
          <label for="uf">UF:</label>
          <input type="text" id="uf" name="uf" required />
        </div>

        <button class="cadastro__salvar" type="submit">Salvar</button>
    </main>
    
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
